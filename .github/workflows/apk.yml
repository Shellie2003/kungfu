# ============================================================
# Construit l'APK Android et le dépose en pièce jointe de
# l'exécution.
#
# Rien à installer, AUCUN SECRET à configurer : la construction se
# fait entièrement sur le coureur GitHub, et l'APK se télécharge
# depuis la page de l'exécution.
#
# Se lance à la main — onglet Actions, « Construire l'APK », bouton
# « Run workflow » — ou automatiquement quand un fichier de app/,
# css/ ou icones.mjs change. Ces trois-là, parce que l'application
# lit la feuille de style et les icônes de la maquette : les
# corriger corrige l'application, et l'APK doit suivre.
#
# La signature
# ------------
# L'APK est signé par la clé de débogage du projet, versionnée dans
# app/signature/. Elle est FIXE : le club installe une mise à jour
# par-dessus la précédente sans désinstaller et sans perdre sa
# session. Sans elle, Gradle en fabriquerait une neuve à chaque
# construction et chaque mise à jour serait refusée.
#
# Ce que cela interdit : la publication sur le Play Store, qui
# refuse la clé de débogage. Ce que cela impose : que l'APK ne
# circule que par un canal de confiance. Le pourquoi est détaillé
# dans app/signature/LISEZ-MOI.md.
# ============================================================
name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Ce que cette version apporte (apparaît dans le résumé)"
        required: false
        default: ""
  push:
    branches: [claude/kung-fu-monastery-mobile-app-4k7q3b]
    paths:
      - 'app/**'
      - 'css/**'
      - 'icones.mjs'
      - '.github/workflows/apk.yml'
      # Et outils/, qui manquait. Les étapes « Ouvrir tous les
      # écrans » et « Comparer à la maquette » sont ce qui décide de
      # construire ou non l'APK, et elles vivent ici. Sans ce chemin,
      # corriger le vérificateur ou son bouchon ne relançait PAS la
      # vérification qu'ils font : on poussait la correction d'un
      # contrôle rouge, et rien ne se passait.
      - 'outils/**'
      # vercel.json décide de la version WEB. Il n'était surveillé
      # nulle part : une erreur y est passée inaperçue deux jours.
      - 'vercel.json'
      # Et les MIGRATIONS, qui manquaient — troisième fois que ce
      # trou se répète, après outils/ et vercel.json.
      #
      # Une migration ne change pas l'APK, ce qui rendait l'oubli
      # défendable. Mais deux contrôles LISENT les migrations :
      #
      #   · verifier-seaux.mjs compare les types de fichiers acceptés
      #     par le code à ceux déclarés pour le seau. C'est ce
      #     contrôle qui a rattrapé le PDF refusé en silence ;
      #   · verifier-ecritures.mjs veille sur ce que les règles
      #     d'accès rendent invisible.
      #
      # Sans ce chemin, changer une migration pouvait rompre l'accord
      # entre le code et la base SANS qu'aucun contrôle ne devienne
      # rouge — c'est-à-dire exactement la panne qu'ils existent pour
      # empêcher, arrivant par la porte qu'on n'avait pas fermée.
      - 'supabase/**'

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Java 21 : la version que demande le greffon Android de
      # Gradle employé par Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        working-directory: app
        run: npm ci

      # Les valeurs Supabase viennent des secrets s'ils existent ;
      # sinon du fichier d'essai versionné. Ainsi la chaîne marche
      # sans aucune configuration, et le jour où l'on pointera vers
      # le projet du club il suffira d'ajouter deux secrets.
      - name: Choisir le serveur
        working-directory: app
        env:
          URL_SECRET: ${{ secrets.SUPABASE_URL }}
          CLE_SECRET: ${{ secrets.SUPABASE_CLE }}
        run: |
          if [ -n "$URL_SECRET" ] && [ -n "$CLE_SECRET" ]; then
            echo "VITE_SUPABASE_URL=$URL_SECRET"  > .env
            echo "VITE_SUPABASE_CLE=$CLE_SECRET" >> .env
            echo "serveur : celui des secrets du dépôt"
          else
            cp .env.essai .env
            echo "serveur : le projet d'essai (.env.essai)"
          fi
          # On montre l'adresse, jamais la clé.
          grep VITE_SUPABASE_URL .env

      # Vercel plafonne « buildCommand » à 256 caractères et REFUSE
      # le déploiement au-delà — avant de construire, donc sans
      # journal de construction. La version web a ainsi cessé d'être
      # mise à jour pendant deux jours sans qu'aucun contrôle ne
      # devienne rouge : rien ici ne regardait vercel.json.
      #
      # Ce contrôle-ci ne remplace pas Vercel, il le devance : il
      # échoue là où l'on regarde, plutôt que sur un tableau de bord
      # qu'on n'ouvre pas.
      - name: Vérifier la configuration web
        run: node outils/verifier-vercel.mjs

      # Une erreur de typage arrête la chaîne ici, plutôt que de
      # produire un APK cassé qu'on installerait pour rien.
      - name: Vérifier les types
        working-directory: app
        run: npx tsc --noEmit

      # Les tests unitaires et d'intégration. Ils tournent AVANT la
      # construction : un test rouge doit arrêter la chaîne, pas
      # produire un APK qu'on découvrirait cassé sur un téléphone.
      #
      # Ce qu'ils couvrent : la logique (dates, matricules, codes
      # USSD) et le comportement des écrans face à un serveur
      # simulé — ce qui s'affiche, et surtout ce qui PART. Un
      # formulaire qui s'affiche mais n'écrit rien ne se voit pas.
      - name: Tests
        working-directory: app
        run: npm test

      # VERSION_CONSTRUITE inscrit le commit DANS le paquet, comme le
      # fait outils/vercel-build.sh pour le web. Sans cela l'APK
      # affichait « Version developpement » en bas de l'écran du
      # club, là où la version web affiche son empreinte : les deux
      # ne disaient pas la même chose, alors qu'elles doivent être
      # jumelles.
      - name: Construire la partie web
        working-directory: app
        env:
          VERSION_CONSTRUITE: ${{ github.sha }}
        run: npx vite build

      # Ouvre chaque écran dans un vrai navigateur, avec un serveur
      # en boîte, et échoue si l'un d'eux ne s'affiche pas. C'est le
      # contrôle qui rattrape une erreur qui ne se voit qu'à
      # l'exécution — un import cassé, une jointure mal lue.
      - name: Ouvrir tous les écrans
        run: |
          # Le contrôleur vit à la racine, avec Playwright et le
          # lecteur de codes QR ; app/ n'en a pas besoin pour
          # tourner.
          npm ci
          npx playwright install --with-deps chromium
          node outils/verifier-app.mjs

      # Mesure l'écart avec la maquette : chaque texte doit être au
      # même pixel, à la même taille, dans la même graisse et la même
      # couleur. C'est ce qui tient la ressemblance dans le temps —
      # sans cette étape, elle se dégrade d'une version à l'autre
      # sans que personne le voie.
      - name: Comparer à la maquette
        run: |
          node build-screens.mjs
          node build.js
          node outils/comparer-app.mjs

      # Le carrousel de l'accueil, dans un vrai navigateur.
      #
      # jsdom ne défile pas : les tests d'intégration comptent les
      # vues, ils ne peuvent pas dire si l'animation part, si elle
      # s'arrête sous le doigt, ni si « moins d'animation » est
      # respecté. Et « Ouvrir tous les écrans » tourne SANS photos,
      # parce que la maquette n'en a aucune — le carrousel y est
      # donc toujours vide.
      - name: Faire tourner le carrousel
        run: node outils/verifier-carrousel.mjs

      # Ce que la comparaison à la maquette ne voit PAS.
      #
      # Elle mesure des pixels et de la géométrie. Elle ne dit rien
      # d'un bouton qu'aucun lecteur d'écran ne sait nommer, d'une
      # cible trop petite pour un doigt, ni d'un parcours au clavier
      # où l'on ne voit jamais où l'on est. Ces trois défauts sont
      # invisibles à qui ne les subit pas : personne ne se plaint, on
      # cesse simplement de se servir de l'écran.
      #
      # Le premier passage en a trouvé onze, dont une barre de
      # recherche de quarante-huit pixels dont dix-huit seulement
      # réagissaient au doigt.
      - name: Vérifier ce qui ne se photographie pas
        run: node outils/verifier-acces.mjs

      # L'application et le seau doivent accepter les MÊMES fichiers.
      #
      # Le PDF était proposé par l'écran, accepté par le sélecteur,
      # autorisé par messagerie.ts, couvert par des tests — et refusé
      # par le seau, dont la liste n'avait jamais quitté les trois
      # types d'images. L'envoi durait plusieurs secondes avant
      # d'échouer.
      #
      # C'est un défaut de RACCORD, et c'est le quatrième du projet.
      # Celui-ci ne peut plus passer.
      - name: Comparer l’application et les seaux
        run: node outils/verifier-seaux.mjs

      # Une écriture doit savoir si elle a écrit.
      #
      # Une règle d'accès ne REJETTE pas une mise à jour : elle rend la
      # ligne invisible. L'écriture ne touche alors rien et répond que
      # tout va bien. L'écran annonce « Enregistré », et rien ne l'a
      # été — le club le découvre des semaines plus tard.
      #
      # Ce défaut est revenu CINQ fois dans ce projet, à cinq endroits
      # différents, et chaque fois il a fallu qu'un humain le
      # remarque. Il ne reviendra plus par inadvertance.
      - name: Vérifier que les écritures écrivent
        run: node outils/verifier-ecritures.mjs

      # Ce que le téléphone télécharge avant d'afficher le premier
      # écran. Sans mesure, un paquet grossit d'un import à la fois —
      # chacun raisonnable — et le total se découvre un an plus tard,
      # sur une connexion lente, chez le club.
      - name: Peser le premier chargement
        run: node outils/verifier-poids.mjs

      # La version WEB, ouverte au chemin où elle est publiée.
      #
      # Les étapes ci-dessus servent app/dist à la RACINE d'un
      # serveur d'essai ; la version publiée vit sous /essai. Cette
      # différence n'était vérifiée nulle part, et elle a suffi à
      # rendre la page entièrement blanche : les chemins relatifs de
      # vite.config.ts — ceux dont l'APK a besoin — se résolvent
      # depuis la racine quand la page est servie à « /essai » sans
      # barre oblique finale.
      #
      # Tout était vert : la construction réussissait, le
      # déploiement passait READY, l'adresse répondait 200. Seul un
      # navigateur pouvait le dire, et aucun n'ouvrait cette page.
      #
      # Cette étape construit avec le même script que Vercel, puis
      # l'ouvre. Elle vient APRÈS les comparaisons : le script pose
      # app/.env, et l'écraser avant elles fausserait leur serveur.
      #
      # VERSION_CONSTRUITE : la MÊME que celle de « Construire la
      # partie web », et pour la même raison qu'elle y est. Sur
      # Vercel, le script lit VERCEL_GIT_COMMIT_SHA ; ici cette
      # variable n'existe pas, et sans repli le paquet web portait
      # « developpement » quand l'APK portait l'empreinte du commit.
      #
      # L'écran du club affiche cette ligne. Les deux versions
      # écrivaient donc un texte différent au même endroit, et
      # l'étape suivante — celle qui les compare au pixel — le
      # voyait : « club : 0.05 % de pixels différents ». Elle avait
      # raison ; c'était bien une divergence, mais fabriquée par
      # cette chaîne, pas par le code. Les constructions 43 et 44
      # s'y sont arrêtées, et n'ont produit aucun APK.
      - name: Ouvrir la version web
        env:
          VERSION_CONSTRUITE: ${{ github.sha }}
        run: |
          bash outils/vercel-build.sh
          node outils/verifier-web.mjs

      # Les deux versions doivent être JUMELLES.
      #
      # Exigence du club, mot pour mot : « tout ce qui est présent
      # dans la version web doit être strictement identique à celle
      # de l'application ».
      #
      # Elles viennent des mêmes sources mais de DEUX commandes —
      # l'APK veut des chemins relatifs, le web des chemins absolus
      # sous /essai. Deux commandes, c'est deux occasions de
      # diverger, et personne ne s'en apercevrait avant le club.
      #
      # On ne compare pas les paquets : le chemin de base change
      # l'ordre des modules, donc les noms que le minificateur
      # invente. On compare CE QUI EST AFFICHÉ, au pixel près.
      #
      # ⚠ APRÈS l'étape ci-dessus, et non avant : c'est elle qui
      # construit essai/. Placée avant, la comparaison ne trouvait
      # aucune page web, rendait des écrans vides, et accusait le
      # code d'avoir divergé — c'est ce qui a fait échouer
      # l'exécution 37.
      - name: Web et application, au pixel près
        run: node outils/verifier-jumeaux.mjs

      # Le dossier android/ n'est pas dans le dépôt : il se régénère
      # à partir de capacitor.config.ts. Un dossier natif commité
      # finit toujours par diverger de la configuration censée le
      # décrire.
      - name: Engendrer le projet Android
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      # La permission caméra, pour le pointage des présences.
      #
      # Elle n'est PAS dans le modèle de Capacitor, et elle a été
      # explicitement retirée au début du projet parce que rien ne
      # s'en servait — une application qui réclame la caméra sans
      # l'employer fait hésiter à l'installation. Elle sert
      # maintenant : le maître scanne les cartes de membre.
      #
      # Le manifeste est engendré, donc pas versionné ; on l'écrit
      # ici. Et l'étape ÉCHOUE si l'ancre a disparu, plutôt que de
      # produire un APK dont la caméra ne s'ouvrira jamais — on ne
      # s'en apercevrait qu'au premier entraînement.
      - name: Déclarer la caméra
        working-directory: app/android/app/src/main
        run: |
          if grep -q 'android.permission.CAMERA' AndroidManifest.xml; then
            echo "déjà déclarée"
            exit 0
          fi
          if ! grep -q '</manifest>' AndroidManifest.xml; then
            echo "::error::Le manifeste engendré n'a pas la forme attendue : la caméra ne serait pas déclarée et le pointage par code QR ne marcherait pas."
            exit 1
          fi
          # « required=false » : le téléphone sans caméra installe
          # quand même. La saisie du matricule marche sans elle, et
          # c'est le chemin de repli assumé de l'écran de pointage.
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' AndroidManifest.xml
          grep -q 'android.permission.CAMERA' AndroidManifest.xml \
            || { echo "::error::L'écriture de la permission caméra a échoué."; exit 1; }
          echo "caméra déclarée"

      # Enregistrer un document reçu dans une conversation.
      #
      # Le fichier est écrit dans le dossier « Documents » du
      # téléphone — celui qu'on retrouve depuis un gestionnaire de
      # fichiers. Depuis Android 10 (API 29), y écrire ne demande
      # aucune permission : chaque application a son propre espace.
      # AVANT, il en fallait une.
      #
      # « maxSdkVersion=28 » est donc l'inverse d'un élargissement :
      # la permission n'existe QUE sur les téléphones qui ne peuvent
      # pas s'en passer, et disparaît des autres. Sans elle, le
      # téléchargement échouerait en silence sur un Android 8 ou 9 —
      # et il y en a dans le club.
      - name: Autoriser l’enregistrement des documents
        working-directory: app/android/app/src/main
        run: |
          if grep -q 'WRITE_EXTERNAL_STORAGE' AndroidManifest.xml; then
            echo "déjà déclarée"
            exit 0
          fi
          if ! grep -q '</manifest>' AndroidManifest.xml; then
            echo "::error::Le manifeste engendré n'a pas la forme attendue : les documents reçus ne pourraient pas être enregistrés sur les Android antérieurs à 10."
            exit 1
          fi
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>|' AndroidManifest.xml
          grep -q 'WRITE_EXTERNAL_STORAGE' AndroidManifest.xml \
            || { echo "::error::L'écriture de la permission de stockage a échoué."; exit 1; }
          echo "enregistrement des documents déclaré"

      # Le numéro de version de l'APK.
      #
      # Capacitor engendre « versionCode 1 » et « versionName 1.0 »,
      # et rien ne les changeait : les trente-sept constructions se
      # présentaient donc à Android comme la MÊME version. Deux
      # conséquences, dont le club a constaté la seconde :
      #
      #   — dans les paramètres du téléphone, toutes les versions
      #     s'appellent « 1.0 ». Impossible de savoir laquelle on a.
      #   — installer par-dessus n'est pas une MISE À JOUR mais une
      #     réinstallation de la même version. Plusieurs surcouches
      #     Android (MIUI, ColorOS…) affichent alors « L'application
      #     n'a pas été installée » tout en menant l'installation à
      #     son terme — exactement le message signalé.
      #
      # Le numéro d'exécution est monotone : la 38 est postérieure à
      # la 37, et Android le comprend comme une vraie mise à jour.
      # Le nom de version porte en plus l'empreinte du commit, pour
      # que la version affichée par le téléphone soit rattachable au
      # code.
      #
      # L'étape ÉCHOUE si l'ancre a disparu, plutôt que de produire
      # un APK qui se réinstallerait éternellement en version 1.0.
      - name: Numéroter la version
        working-directory: app/android/app
        run: |
          COURT=$(echo "${{ github.sha }}" | cut -c1-7)
          if ! grep -qE 'versionCode [0-9]+' build.gradle; then
            echo "::error::build.gradle n'a pas la forme attendue : la version resterait 1.0 et chaque installation se ferait passer pour une réinstallation."
            exit 1
          fi
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.run_number }}.0 ($COURT)\"/" build.gradle
          grep -E 'versionCode|versionName' build.gradle

      # La clé de débogage du projet remplace celle que Gradle
      # fabriquerait tout seul sur cette machine neuve. Sans cela la
      # signature changerait à chaque construction et le club ne
      # pourrait plus installer de mise à jour par-dessus.
      #
      # On la contrôle par empreinte avant de l'employer : si le
      # fichier avait été remplacé, mieux vaut le savoir ici que sur
      # le téléphone du club.
      - name: Poser la clé de signature
        working-directory: app
        run: |
          ATTENDU="A6:02:3C:36:4A:06:D2:D9:BF:AB:5F:3A:CC:87:D8:28:61:92:9A:6F:63:E7:BA:0C:FA:71:44:4E:28:B3:FD:3A"
          OBTENU=$(keytool -list -v -keystore signature/debug.keystore -storepass android 2>/dev/null \
                   | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ' \r')
          echo "empreinte : $OBTENU"
          if [ "$OBTENU" != "$ATTENDU" ]; then
            echo "::error::La clé de signature n'est pas celle attendue. Les mises à jour ne s'installeraient plus par-dessus la version précédente."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          cp signature/debug.keystore "$HOME/.android/debug.keystore"
          echo "signature stable — la mise à jour s'installera par-dessus"

      - name: Construire
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nommer avec le numéro d'exécution
        id: nommer
        working-directory: app/android/app/build/outputs/apk/debug
        run: |
          NOM="waishi-${{ github.run_number }}.apk"
          mv app-debug.apk "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "taille=$(du -h "$NOM" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nommer.outputs.nom }}
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Les captures d'écran des seize écrans, prises pendant le
      # contrôle. Elles permettent de voir ce que contient cette
      # version sans installer l'APK — utile pour faire valider un
      # changement au club à distance.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecrans-${{ github.run_number }}
          path: outils/comparaisons/app/*.png
          retention-days: 14

      - name: Résumé
        run: |
          {
            echo "## APK prêt"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`${{ steps.nommer.outputs.nom }}\` |"
            echo "| Taille | ${{ steps.nommer.outputs.taille }} |"
            echo "| Version | \`${{ github.sha }}\` |"
            if [ -n "${{ github.event.inputs.note }}" ]; then
              echo "| Note | ${{ github.event.inputs.note }} |"
            fi
            echo ""
            echo "Téléchargez-le dans **Artifacts**, en bas de cette page."
            echo "Sur le téléphone : autoriser l'installation depuis cette source, puis ouvrir le fichier."
            echo ""
            echo "**ecrans-${{ github.run_number }}** contient une capture de chacun des seize écrans,"
            echo "prise pendant la vérification — pour regarder cette version sans l'installer."
            echo ""
            echo "Comptes d'essai : \`F04x042\` élève, \`F04x045\` maître, \`F04x001\` administration."
            echo "Les mots de passe ne sont pas dans le dépôt — il est public."
            echo ""
            echo "> Signé par la clé de débogage du projet — installable et **mise à jour par-dessus**,"
            echo "> mais pas publiable sur le Play Store. Voir \`app/signature/LISEZ-MOI.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
