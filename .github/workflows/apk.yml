# ============================================================
# Construit l'APK Android et le dépose en pièce jointe de
# l'exécution.
#
# Rien à installer, aucun compte Expo, AUCUN SECRET à configurer :
# la construction se fait entièrement sur le coureur GitHub, et
# l'APK se télécharge depuis la page de l'exécution.
#
# Se lance à la main — onglet Actions, « Construire l'APK », bouton
# « Run workflow » — ou automatiquement quand un fichier de mobile/
# change.
#
# La signature
# ------------
# L'APK est signé par la clé de débogage livrée avec le modèle
# d'Expo. C'est un fichier FIXE, identique sur toutes les machines,
# valide jusqu'en 2052 : la signature est donc stable d'une
# construction à l'autre, et le club installe une mise à jour
# par-dessus la précédente sans désinstaller.
#
# Ce que cela interdit : la publication sur le Play Store, qui
# refuse la clé de débogage. Le jour venu, il faudra une vraie clé
# — et ce jour-là, l'application devra être désinstallée une fois,
# puisque la signature change.
# ============================================================
name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Ce que cette version apporte (apparaît dans le résumé)"
        required: false
        default: ""
  push:
    branches: [claude/kung-fu-monastery-mobile-app-4k7q3b]
    paths:
      - 'mobile/**'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Java 17 : la version que demande le greffon Android de Gradle
      # employé par React Native 0.76. Le coureur en propose de plus
      # récentes, qui échouent.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      # Une erreur de typage arrête la chaîne ici, plutôt que de
      # produire un APK cassé qu'on installerait pour rien.
      - name: Vérifier les types
        working-directory: mobile
        run: npx tsc --noEmit

      # Les valeurs Supabase viennent des secrets s'ils existent ;
      # sinon du fichier d'essai versionné. Ainsi la chaîne marche
      # sans aucune configuration, et le jour où l'on pointera vers
      # le projet du club il suffira d'ajouter deux secrets.
      - name: Choisir le serveur
        working-directory: mobile
        env:
          URL_SECRET: ${{ secrets.SUPABASE_URL }}
          CLE_SECRET: ${{ secrets.SUPABASE_CLE }}
        run: |
          if [ -n "$URL_SECRET" ] && [ -n "$CLE_SECRET" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$URL_SECRET"  > .env
            echo "EXPO_PUBLIC_SUPABASE_CLE=$CLE_SECRET" >> .env
            echo "serveur : celui des secrets du dépôt"
          else
            cp .env.essai .env
            echo "serveur : le projet d'essai (.env.essai)"
          fi
          # On montre l'adresse, jamais la clé.
          grep EXPO_PUBLIC_SUPABASE_URL .env

      # Le dossier android/ n'est pas dans le dépôt : il se régénère
      # à partir de app.json. Un dossier natif commité finit toujours
      # par diverger de la configuration censée le décrire.
      - name: Engendrer le projet Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # Contrôle avant de construire : la clé de débogage doit être
      # celle du modèle d'Expo. Si Expo la changeait un jour, la
      # signature changerait sans prévenir et les mises à jour
      # cesseraient de s'installer par-dessus. Mieux vaut le savoir
      # ici que sur le téléphone du club.
      - name: Vérifier la stabilité de la signature
        working-directory: mobile/android/app
        run: |
          ATTENDU="FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C"
          OBTENU=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null \
                   | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ' \r')
          echo "empreinte : $OBTENU"
          if [ "$OBTENU" != "$ATTENDU" ]; then
            echo "::warning::La clé de débogage d'Expo a changé. Les mises à jour ne s'installeront plus par-dessus la version précédente : il faudra désinstaller une fois."
          else
            echo "signature stable — la mise à jour s'installera par-dessus"
          fi

      - name: Construire
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Nommer avec le numéro d'exécution
        id: nommer
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          NOM="waishi-${{ github.run_number }}.apk"
          mv app-release.apk "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "taille=$(du -h "$NOM" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nommer.outputs.nom }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Résumé
        run: |
          {
            echo "## APK prêt"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`${{ steps.nommer.outputs.nom }}\` |"
            echo "| Taille | ${{ steps.nommer.outputs.taille }} |"
            echo "| Version | \`${{ github.sha }}\` |"
            if [ -n "${{ github.event.inputs.note }}" ]; then
              echo "| Note | ${{ github.event.inputs.note }} |"
            fi
            echo ""
            echo "Téléchargez-le dans **Artifacts**, en bas de cette page."
            echo "Sur le téléphone : autoriser l'installation depuis cette source, puis ouvrir le fichier."
            echo ""
            echo "Comptes d'essai : \`F04x042\` élève, \`F04x045\` maître, \`F04x001\` administration."
            echo "Les mots de passe ne sont pas dans le dépôt — il est public."
            echo ""
            echo "> Signé par la clé de débogage — installable, mais pas publiable sur le Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
