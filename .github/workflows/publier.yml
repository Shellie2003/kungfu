# ============================================================
# PUBLIER UNE VERSION AUX MEMBRES.
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# Ce workflow est le SEUL qui signe avec la vraie clé du club, et le
# seul qui publie quelque chose que les téléphones iront chercher
# tout seuls. Il ne tourne donc que sur une étiquette, jamais sur une
# poussée ordinaire.
#
# ------------------------------------------------------------
# POURQUOI IL EST SÉPARÉ DE apk.yml
#
# apk.yml construit à chaque poussée et dépose un APK de DÉBOGAGE en
# pièce jointe d'exécution : c'est ce qui sert à essayer une
# correction sur un téléphone, et cela doit rester rapide et sans
# conséquence.
#
# Celui-ci publie. Les mélanger voudrait dire manipuler la clé de
# signature du club à chaque commit, et publier une version à chaque
# faute de frappe.
#
# Mise en place complète : LIVRER.md à la racine.
# ============================================================
name: Publier une version

on:
  # Par une étiquette, depuis un terminal :
  #     git tag -a v1.1.0 -m "…" && git push origin v1.1.0
  push:
    tags: ['v*']

  # ------------------------------------------------------------
  # OU PAR UN BOUTON, SANS TERMINAL.
  #
  # « Je n'utilise pas de terminal, je travaille dans le navigateur :
  # pas moyen d'exécuter les commandes. »
  #
  # Poser une étiquette demandait git, donc une machine, donc un
  # terminal — et rendait la publication impossible à qui gère le club
  # depuis un téléphone ou un navigateur. Ce n'est pas tenable pour un
  # dépôt qu'on remet à une association : celui qui reprendra ce
  # projet n'aura pas forcément d'ordinateur configuré.
  #
  # Onglet Actions → « Publier une version » → « Run workflow ».
  #
  # L'étiquette n'est alors PAS posée d'avance : le numéro vient de
  # app/package.json, et la Release la crée en se publiant. C'est le
  # même numéro dans les deux cas — celui que les téléphones comparent.
  # ------------------------------------------------------------
  workflow_dispatch:
    inputs:
      notes:
        description: "Ce que cette version apporte, en une phrase (lue par les membres)"
        required: false
        default: ""

# Sans cela, le pas « créer la Release » échoue avec un 403 dont la
# cause n'est pas évidente : par défaut un workflow ne peut que LIRE
# le dépôt.
permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------
      # L'ÉTIQUETTE ET LE NUMÉRO DOIVENT CONCORDER.
      #
      # C'est le numéro de package.json que les téléphones comparent
      # au leur — pas l'étiquette. Publier « v1.2.0 » avec un
      # package.json resté à « 1.1.0 » donnerait une Release nommée
      # 1.2.0 dont les téléphones ne verraient jamais la nouveauté :
      # ils compareraient 1.1.0 à 1.1.0.
      #
      # Ce défaut-là ne se voit PAS : la publication réussit, la
      # Release est là, et les membres ne reçoivent rien. On échoue
      # donc ici, bruyamment.
      # ------------------------------------------------------------
      - name: Quelle version publie-t-on ?
        id: version
        env:
          NOTES_SAISIES: ${{ inputs.notes }}
        run: |
          NUMERO=$(node -p "require('./app/package.json').version")
          echo "app/package.json : $NUMERO"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Lancée par une étiquette : elle doit concorder avec le
            # numéro. Publier « v1.2.0 » avec un package.json resté à
            # « 1.1.0 » donnerait une Release nommée 1.2.0 dont les
            # téléphones ne verraient jamais la nouveauté — ils
            # compareraient 1.1.0 à 1.1.0. Ce défaut ne se voit PAS :
            # la publication réussit et les membres ne reçoivent rien.
            ETIQUETTE="${GITHUB_REF_NAME#v}"
            echo "étiquette : $ETIQUETTE"
            if [ "$ETIQUETTE" != "$NUMERO" ]; then
              echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $NUMERO de app/package.json. Les téléphones comparent le NUMÉRO : la mise à jour ne serait proposée à personne."
              exit 1
            fi
            NOTES=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          else
            # Lancée au bouton : l'étiquette n'existe pas encore, la
            # Release la posera. On refuse en revanche de republier un
            # numéro déjà sorti — les téléphones qui l'ont ne verraient
            # rien de neuf, et l'on croirait avoir livré.
            if git ls-remote --exit-code --tags origin "refs/tags/v$NUMERO" >/dev/null 2>&1; then
              echo "::error::La version $NUMERO est déjà publiée. Changez le numéro dans app/package.json avant de publier : c'est lui que les téléphones comparent, et republier le même ne proposerait rien à personne."
              exit 1
            fi
            NOTES="$NOTES_SAISIES"
          fi

          echo "numero=$NUMERO" >> "$GITHUB_OUTPUT"
          # Sur plusieurs lignes : une note peut contenir n'importe
          # quel caractère, y compris ceux qui casseraient « clé=valeur ».
          {
            echo "notes<<FIN_DES_NOTES"
            echo "$NOTES"
            echo "FIN_DES_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer
        working-directory: app
        run: npm ci

      # ------------------------------------------------------------
      # LA BATTERIE, AVANT DE SIGNER QUOI QUE CE SOIT.
      #
      # C'est le seul garde-fou entre une erreur et soixante-quatre
      # téléphones. Une version qui ne passe pas n'est pas publiée —
      # et comme la mise à jour est automatique, une mauvaise version
      # publiée se répand toute seule.
      # ------------------------------------------------------------
      - name: Les essais
        working-directory: app
        run: npx vitest run

      # ------------------------------------------------------------
      # ⚠ SANS SERVEUR, LA CONSTRUCTION RÉUSSIT QUAND MÊME.
      #
      # Vite ne se plaint pas d'une variable vide : il la remplace par
      # rien et fabrique un APK complet, d'apparence normale, qui ne
      # parle à AUCUN serveur. Personne ne pourrait s'y connecter, et
      # le défaut ne se verrait qu'une fois l'application installée.
      #
      # apk.yml peut se permettre de retomber sur .env.essai — il
      # fabrique un APK d'essai. Ici on publie : mieux vaut refuser de
      # signer que distribuer une application vide.
      # ------------------------------------------------------------
      - name: Le serveur est-il connu ?
        env:
          URL_SECRET: ${{ secrets.SUPABASE_URL }}
          CLE_SECRET: ${{ secrets.SUPABASE_CLE }}
        run: |
          if [ -z "$URL_SECRET" ] || [ -z "$CLE_SECRET" ]; then
            echo "::error::Les secrets SUPABASE_URL et SUPABASE_CLE sont nécessaires pour publier : sans eux l'APK se construirait sans serveur et personne ne pourrait se connecter. Voir LIVRER.md, partie 3."
            exit 1
          fi
          echo "serveur : $URL_SECRET"

      - name: Construire l'application
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_CLE: ${{ secrets.SUPABASE_CLE }}
          VERSION_CONSTRUITE: ${{ github.sha }}
        run: npx vite build

      - name: Engendrer le projet Android
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      # ------------------------------------------------------------
      # ⚠ L'OUTIL DES ICÔNES VIT À LA RACINE, PAS DANS app/.
      #
      # Il emploie Playwright, qui est déclaré dans le package.json
      # de la RACINE — « Installer » ci-dessus ne pose que les
      # dépendances de app/. Sans ces deux lignes, l'étape échoue sur
      # « Cannot find package 'playwright' ».
      #
      # Ce défaut était ici, dans un workflow qui n'a jamais tourné,
      # pendant que le même — un import qui ne se résout que sur une
      # machine — coûtait trois exécutions à apk.yml. Il aurait
      # frappé le jour de la première publication.
      # ------------------------------------------------------------
      - name: Poser l'icône du club
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node outils/poser-icones.mjs

      - name: Déclarer la caméra
        working-directory: app/android/app/src/main
        run: |
          if grep -q 'android.permission.CAMERA' AndroidManifest.xml; then
            echo "déjà déclarée"
          elif grep -q '<application' AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n\n    <application|' AndroidManifest.xml
            grep -q 'android.permission.CAMERA' AndroidManifest.xml || exit 1
            echo "caméra déclarée"
          else
            echo "::error::Le manifeste n'a pas l'ancre attendue."
            exit 1
          fi

      # ------------------------------------------------------------
      # ⚠ ELLE MANQUAIT ICI, ET SEULEMENT ICI.
      #
      # apk.yml déclare cette permission ; ce workflow-ci ne la
      # déclarait pas. L'APK d'essai savait donc enregistrer les
      # documents reçus dans la messagerie, et celui que le CLUB
      # aurait installé ne l'aurait pas su — sur les Android
      # antérieurs à 10, où la permission est encore exigée.
      #
      # C'est le pire genre d'écart : les deux APK portent le même
      # numéro de version, se ressemblent en tout, et l'un a une
      # fonctionnalité que l'autre n'a pas. On aurait cherché le
      # défaut dans le code, où il n'était pas.
      #
      # ⚠ TOUTE ÉTAPE AJOUTÉE À apk.yml ENTRE « Engendrer le projet
      # Android » ET « Construire » DOIT ÊTRE AJOUTÉE ICI AUSSI.
      # ------------------------------------------------------------
      - name: Autoriser l’enregistrement des documents
        working-directory: app/android/app/src/main
        run: |
          if grep -q 'WRITE_EXTERNAL_STORAGE' AndroidManifest.xml; then
            echo "déjà déclarée"
            exit 0
          fi
          if ! grep -q '</manifest>' AndroidManifest.xml; then
            echo "::error::Le manifeste engendré n'a pas la forme attendue : les documents reçus ne pourraient pas être enregistrés sur les Android antérieurs à 10."
            exit 1
          fi
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>|' AndroidManifest.xml
          grep -q 'WRITE_EXTERNAL_STORAGE' AndroidManifest.xml \
            || { echo "::error::L'écriture de la permission de stockage a échoué."; exit 1; }
          echo "enregistrement des documents déclaré"

      # ------------------------------------------------------------
      # LE NUMÉRO DE VERSION, DANS L'APK.
      #
      # Deux nombres, et ils ne servent pas à la même chose :
      #
      #   versionName — « 1.1.0 », ce que la personne lit ;
      #   versionCode — un ENTIER qu'Android exige croissant. Il
      #                 refuse d'installer un APK dont le code est
      #                 inférieur ou égal à celui déjà en place.
      #
      # Le second vient du numéro d'exécution du workflow, qui
      # augmente tout seul et ne redescend jamais. Le dériver du
      # versionName — 1.1.0 → 10100 — obligerait à ne jamais
      # republier une même version, ce qui arrive pourtant quand une
      # publication échoue à mi-chemin.
      # ------------------------------------------------------------
      - name: Inscrire la version dans l'APK
        working-directory: app/android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.numero }}\"/" build.gradle
          grep -E 'versionCode|versionName' build.gradle

      # ------------------------------------------------------------
      # LA CLÉ DU CLUB.
      #
      # Elle arrive encodée en base64 dans un secret, parce que
      # GitHub ne stocke que du texte. Le fichier reconstitué vit le
      # temps de la construction et disparaît avec la machine.
      #
      # ⚠ Sans les quatre secrets, ce pas échoue — et c'est voulu.
      # Publier une version signée par la clé de DÉBOGAGE, dont le
      # mot de passe est « android » et qui est dans le dépôt,
      # laisserait n'importe qui fabriquer une fausse mise à jour du
      # club. Voir LIVRER.md, partie 1.
      # ------------------------------------------------------------
      - name: Poser la clé de signature du club
        working-directory: app/android
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est absent. Voir LIVRER.md, partie 1."
            exit 1
          fi
          echo "$CLE" | base64 -d > waishi-release.jks
          echo "empreinte de la clé employée :"
          keytool -list -v -keystore waishi-release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>/dev/null \
            | grep 'SHA256:' | head -1

      - name: Construire et signer
        working-directory: app/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/waishi-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # ------------------------------------------------------------
      # LES DEUX FICHIERS, AUX NOMS FIXES.
      #
      # GitHub sert toujours le dernier fichier d'un nom donné à
      # l'adresse …/releases/latest/download/<nom>. Des noms fixes
      # veulent dire une adresse fixe — donc l'application n'a besoin
      # ni de l'API de GitHub, ni d'un jeton, ni de connaître le
      # numéro de la dernière version pour aller la chercher.
      #
      # ⚠ NE JAMAIS LES RENOMMER. Les téléphones déjà installés
      # continueraient à chercher l'ancien nom, et cesseraient de
      # voir les mises à jour sans rien dire.
      # ------------------------------------------------------------
      - name: Préparer la Release
        env:
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          mkdir -p publication
          cp app/android/app/build/outputs/apk/release/app-release.apk publication/waishi.apk
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync('publication/waishi.json', JSON.stringify({
              numero: '${{ steps.version.outputs.numero }}',
              notes: (process.argv[1] || '').trim()
            }, null, 2) + '\n');
          " "$NOTES"
          cat publication/waishi.json
          ls -lh publication/

      # ------------------------------------------------------------
      # ⚠ « tag_name » EST INDISPENSABLE DEPUIS QU'ON PUBLIE AU BOUTON.
      #
      # Sans lui, l'action prend l'étiquette de la référence courante —
      # ce qui marchait tant que le workflow ne partait QUE d'une
      # étiquette. Lancé à la main depuis une branche, il n'y en a
      # aucune : la publication échouerait, ou pire, s'accrocherait au
      # nom de la branche.
      #
      # L'étiquette est donc nommée explicitement, et l'action la CRÉE
      # si elle n'existe pas. C'est ce qui remplace le « git tag » que
      # l'on ne peut pas taper sans terminal.
      # ------------------------------------------------------------
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          name: Version ${{ steps.version.outputs.numero }}
          files: |
            publication/waishi.apk
            publication/waishi.json
          generate_release_notes: true

      - name: Résumé
        run: |
          {
            echo "## Version ${{ steps.version.outputs.numero }} publiée"
            echo ""
            echo "Les membres la verront proposée à la prochaine ouverture de"
            echo "l'application — au plus une fois par jour et par téléphone."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${{ steps.version.outputs.numero }}\` |"
            echo "| versionCode | \`${{ github.run_number }}\` |"
            echo "| APK | \`waishi.apk\` |"
          } >> "$GITHUB_STEP_SUMMARY"
