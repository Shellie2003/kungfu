  <style>
/* ============================================================
   Kung-fu Waishi Analamahitsy — Maquette
   Vert dominant, blanc secondaire. Toutes les couleurs de texte
   ont été mesurées sur leur fond : minimum 4,5:1.
   ============================================================ */

:root {
  --vert: #0F5132;        /* bandeaux, boutons — blanc dessus 9,4:1 */
  --vert-texte: #12613C;  /* liens, libellés — sur blanc 7,5:1 */
  --vert-clair: #E8F1EC;  /* fonds teintés, vignettes */
  --fond: #F5F8F6;        /* fond d'écran */
  --encre: #0E2119;       /* texte principal — 16,8:1 */
  --gris: #59685F;        /* texte de soutien — 5,9:1 */
  --gris-clair: #7C8B82;
  --filet: #E4EDE8;
  --bord: #DCE7E1;
  --alerte: #E4572E;

  --display: 'Archivo', 'Helvetica Neue', Helvetica, sans-serif;
  --texte: 'Karla', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
p, h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

body {
  font-family: var(--texte);
  color: var(--encre);
  background: #0B1C13;
  -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------
   Coquille de présentation — index des écrans et cadre téléphone.
   Cette partie ne fait pas partie de l'application : elle sert à
   présenter la maquette au client.
   ------------------------------------------------------------ */
.wrap { display: grid; grid-template-columns: 274px 1fr; height: 100dvh; }

.index {
  overflow-y: auto; padding: 22px 0 40px;
  background: #0B1C13; border-right: 1px solid rgba(255, 255, 255, .08);
  color: #C7DCD0;
}
.index__brand { padding: 0 22px 18px; border-bottom: 1px solid rgba(255, 255, 255, .08); margin-bottom: 12px; }
.index__mark { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 16px; font-weight: 700; color: #FFF; letter-spacing: .02em; }
.index__mark i { width: 28px; height: 28px; border-radius: 8px; background: #FFF; display: grid; place-items: center; flex: none; }
.index__sub { margin-top: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #7FA893; }
.index__group { padding: 16px 22px 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #6E9481; }
.index__link {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 22px; font-size: 13px; color: #B4CCC0; text-align: left;
  border-left: 2px solid transparent;
}
.index__link:hover { background: rgba(255, 255, 255, .05); color: #FFF; }
.index__link[aria-current="true"] { background: rgba(255, 255, 255, .09); border-left-color: #7FD9A8; color: #FFF; }
.index__num { font-family: var(--display); font-size: 11px; color: #6E9481; min-width: 18px; }
.index__link[aria-current="true"] .index__num { color: #7FD9A8; }

.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 28px; overflow: auto; background: radial-gradient(120% 90% at 50% 0%, #17392A 0%, #0B1C13 70%); }
.stage__caption { font-size: 13px; color: #8FB3A0; text-align: center; }
.stage__caption b { color: #FFF; font-weight: 600; }

.device { width: 390px; flex: none; border-radius: 44px; padding: 10px; background: #060F0A; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .09); }
.device__screen { width: 100%; height: 780px; border-radius: 36px; overflow: hidden; background: var(--fond); }
.device__screen > .phone { height: 100%; overflow-y: auto; scrollbar-width: none; }
.device__screen > .phone::-webkit-scrollbar { width: 0; }

/* La charte sort du cadre téléphone : elle n'est pas un écran. */
.wide { width: min(880px, 100%); background: #FFF; border-radius: 20px; overflow: hidden; box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .6); max-height: 84vh; overflow-y: auto; }

/* ------------------------------------------------------------
   L'application
   ------------------------------------------------------------ */
.phone { min-height: 780px; display: flex; flex-direction: column; background: var(--fond); }
.phone--green { background: var(--vert); }

.display { font-family: var(--display); font-weight: 700; }
.overline { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }

/* Bandeau d'accueil */
.hero { background: var(--vert); padding: 22px 20px 26px; display: flex; flex-direction: column; gap: 20px; }
.hero__note { background: #12613C; border: 1px solid #2E7A55; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }

.emblem { width: 46px; height: 46px; border-radius: 12px; background: #FFF; display: grid; place-items: center; flex: none; }
.emblem--lg { width: 72px; height: 72px; border-radius: 20px; }

/* En-tête d'écran */
.apphead { background: #FFF; border-bottom: 1px solid var(--filet); padding: 10px 8px 12px; display: flex; align-items: center; gap: 4px; }
.apphead__title { flex-grow: 1; font-family: var(--display); font-size: 18px; font-weight: 600; }

.tapicon { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 12px; }
.tapicon:hover { background: rgba(15, 81, 50, .07); }

.dot { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--alerte); color: #FFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--vert); }
.dot--plain { min-width: 0; width: 9px; height: 9px; padding: 0; top: 9px; right: 9px; border-color: #FFF; }

/* Cartes et listes */
.card { background: #FFF; border: 1px solid var(--filet); border-radius: 16px; padding: 18px; text-align: left; }
.hr { height: 1px; background: #EDF3F0; }
.list { background: #FFF; border: 1px solid var(--filet); border-radius: 16px; overflow: hidden; }
.listrow { display: flex; align-items: center; gap: 13px; padding: 14px 16px; }
.listrow + .listrow { border-top: 1px solid #EDF3F0; }

.rowhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { font-size: 13px; font-weight: 600; color: var(--vert-texte); }
.linkrow { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 14px; font-weight: 600; color: var(--vert-texte); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* Marque-place d'image */
.ph { background: var(--vert-clair); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.ph__label { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #7C9A8A; text-transform: uppercase; }

/* Actualités */
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 6px; }
.datebox { width: 56px; height: 56px; border-radius: 12px; background: var(--vert-clair); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.datebox b { font-family: var(--display); font-size: 19px; color: var(--vert); line-height: 20px; }
.datebox i { font-size: 10px; font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; font-style: normal; }
.newsrow { display: flex; gap: 14px; align-items: flex-start; width: 100%; }
.newscard { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.newscard--new { border-color: #C4D4CB; }

/* Étudiants */
.searchbar { display: flex; align-items: center; gap: 10px; background: #FFF; border: 1px solid var(--bord); border-radius: 12px; padding: 0 14px; min-height: 48px; font-size: 15px; color: #8A978F; }
.studentrow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; }

.grade { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: #F1F6F3; border: 1px solid var(--bord); font-size: 12px; font-weight: 600; }
.grade i { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); }

/* Champs masqués du profil verrouillé */
.masked { display: flex; flex-direction: column; gap: 1px; background: #EDF3F0; border-radius: 12px; overflow: hidden; }
.masked > div { background: #F8FBF9; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--gris); }
.masked__dots { display: flex; gap: 4px; }
.masked__dots i { width: 5px; height: 5px; border-radius: 50%; background: #B9C7BF; }

.tile { width: 46px; height: 46px; border-radius: 14px; background: var(--vert-clair); display: grid; place-items: center; flex: none; }
.tile--sm { width: 36px; height: 36px; border-radius: 11px; }

.banner { display: flex; align-items: center; gap: 8px; background: var(--vert-clair); border-radius: 10px; padding: 10px 13px; font-size: 12px; font-weight: 600; color: var(--vert); }

.deflist { display: flex; flex-direction: column; }
.deflist > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 13px; color: var(--gris); }
.deflist > div + div { border-top: 1px solid #EDF3F0; }
.deflist b { font-size: 14px; font-weight: 600; color: var(--encre); text-align: right; }

.valuerow { display: flex; gap: 13px; align-items: flex-start; padding: 14px 16px; }

/* Album */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tilephoto { aspect-ratio: 1 / 1; border-radius: 12px; background: var(--vert-clair); display: grid; place-items: center; }

/* Notifications */
.notif { display: flex; gap: 13px; align-items: flex-start; width: 100%; padding: 14px 16px; }
.notif--new { border-color: #C4D4CB; }
.unread { width: 7px; height: 7px; border-radius: 50%; background: var(--alerte); flex: none; }

.warn { background: #FBEEE2; border: 1px solid #EFD7BE; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.warn i { width: 8px; height: 8px; border-radius: 50%; background: #B0530F; flex: none; margin-top: 6px; }
.warn p { font-size: 13px; line-height: 20px; color: #6B4218; }

/* Contrôles */
.chips { display: flex; gap: 8px; padding: 14px 20px 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { height: 0; }
.chip { flex: none; padding: 9px 15px; border-radius: 999px; font-size: 13px; background: #FFF; color: var(--gris); border: 1px solid var(--bord); }
.chip--on { background: var(--vert); color: #FFF; border-color: var(--vert); font-weight: 600; }

.btn { min-height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; width: 100%; }
.btn--primary { background: var(--vert); color: #FFF; }
.btn--ghost { background: #FFF; color: var(--vert-texte); border: 1px solid #C4D4CB; }
.btn--soft { background: var(--vert-clair); color: var(--vert); }

.field { display: flex; flex-direction: column; gap: 7px; }
.field__label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.input { min-height: 48px; border-radius: 12px; background: #F1F6F3; border: 1px solid var(--bord); display: flex; align-items: center; padding: 0 14px; font-size: 15px; }
.input--on { background: #FFF; border: 2px solid var(--vert); padding: 0 13px; }

/* Navigation inférieure */
.tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFF; border-top: 1px solid var(--filet); padding: 8px 4px 14px; position: sticky; bottom: 0; }
.tabbar__item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; min-height: 44px; }

/* ------------------------------------------------------------
   Charte graphique
   ------------------------------------------------------------ */
.sheet { padding: 40px; display: flex; flex-direction: column; gap: 36px; background: #FFF; }
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.swatch { border: 1px solid var(--filet); border-radius: 14px; padding: 0 0 13px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.swatch__chip { height: 76px; display: block; border-bottom: 1px solid var(--filet); }
.swatch b { font-size: 13px; padding: 11px 13px 0; }
.swatch code { font-family: var(--display); font-size: 12px; color: var(--gris); padding: 0 13px; }
.swatch span:not(.swatch__chip) { font-size: 11px; color: var(--gris); padding: 0 13px; line-height: 16px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.scale { display: flex; flex-direction: column; gap: 14px; }
.scale > div { display: flex; align-items: baseline; gap: 20px; }
.scale > div > span:first-child { width: 92px; font-size: 11px; color: var(--gris); flex: none; }

/* ------------------------------------------------------------
   Sur écran étroit, l'échafaudage disparaît et l'app prend tout
   ------------------------------------------------------------ */
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; }
  .index { display: none; }
  .stage { padding: 0; gap: 0; justify-content: flex-start; background: var(--fond); }
  .stage__caption { display: none; }
  .device { width: 100%; border-radius: 0; padding: 0; box-shadow: none; }
  .device__screen { height: 100dvh; border-radius: 0; }
  .phone { min-height: 100dvh; }
  .wide { max-height: none; border-radius: 0; }
}

/* ============================================================
   MOUVEMENT — s'applique à tous les écrans
   Rien de clignotant : des entrées décalées, un appui qui répond,
   des transitions courtes. Le mouvement sert la lecture.
   ============================================================ */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes floaty { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(12px, -18px) scale(1.06); } }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes countin { from { opacity: 0; transform: translateY(24px) scale(.94); } }

/* Entrée en cascade : les blocs arrivent l'un après l'autre. */
.enter > * { animation: rise .52s cubic-bezier(.2, .75, .3, 1) both; }
.enter > *:nth-child(1) { animation-delay: .02s; }
.enter > *:nth-child(2) { animation-delay: .08s; }
.enter > *:nth-child(3) { animation-delay: .14s; }
.enter > *:nth-child(4) { animation-delay: .20s; }
.enter > *:nth-child(5) { animation-delay: .26s; }
.enter > *:nth-child(n+6) { animation-delay: .32s; }

/* Retour tactile : tout ce qui mène quelque part répond à l'appui. */
[data-go] { transition: transform .16s cubic-bezier(.2, .75, .3, 1), box-shadow .2s; }
[data-go]:active { transform: scale(.975); }
.card[data-go]:hover, .listrow:hover { box-shadow: 0 6px 20px -10px rgba(15, 81, 50, .35); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   DIRECTION A · LAME — géométrie diagonale
   ============================================================ */
.dirA { background: #F4F8F6; }
.dirA__head {
  position: relative; background: var(--vert); color: #FFF;
  padding: 22px 20px 58px; overflow: hidden;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 42px), 0 100%);
}
.dirA__glow {
  position: absolute; inset: -40% -30% auto auto; width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(127, 217, 168, .32), transparent 68%);
  animation: floaty 9s ease-in-out infinite;
}
.dirA__top { position: relative; display: flex; align-items: center; gap: 12px; }
.dirA__name { display: block; font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: .16em; }
.dirA__place { display: block; font-size: 12px; color: #A8CDB9; font-style: normal; margin-top: 2px; }

.dirA__count { position: relative; display: flex; align-items: flex-end; gap: 14px; margin-top: 28px; }
.dirA__num {
  font-family: var(--display); font-size: 92px; font-weight: 700; line-height: .82;
  letter-spacing: -.04em; color: #FFF;
  animation: countin .7s cubic-bezier(.2, .8, .25, 1) both .1s;
}
.dirA__lbl { font-size: 13px; line-height: 17px; color: #A8CDB9; padding-bottom: 8px; }

/* Trois traits obliques : la trace d'un mouvement, pas un décor. */
.dirA__strokes { position: absolute; right: -10px; bottom: 46px; display: flex; gap: 7px; transform: skewX(-24deg); }
.dirA__strokes i { width: 5px; height: 46px; border-radius: 3px; background: rgba(127, 217, 168, .55); }
.dirA__strokes i:nth-child(2) { height: 66px; background: rgba(127, 217, 168, .34); }
.dirA__strokes i:nth-child(3) { height: 30px; background: rgba(127, 217, 168, .22); }

.dirA__body { flex-grow: 1; padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 14px; }

.dirA__next {
  position: relative; background: #FFF; border: 1px solid var(--filet);
  padding: 20px 54px 20px 20px; display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 22px 100%, 0 calc(100% - 22px));
  box-shadow: 0 14px 34px -22px rgba(15, 81, 50, .5);
}
.dirA__tag { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--vert-texte); }
.dirA__title { font-family: var(--display); font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
.dirA__meta { font-size: 13px; color: var(--gris); }
.dirA__go { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; background: var(--vert-clair); display: grid; place-items: center; }

.dirA__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dirA__cut {
  background: #FFF; border: 1px solid var(--filet); padding: 18px;
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
}
.dirA__cut--dark { background: var(--encre); border-color: var(--encre); }
.dirA__cut--dark .dirA__cutnum { color: #7FD9A8; }
.dirA__cut--dark .dirA__cutlbl { color: #8FA79A; }
.dirA__cutnum { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; color: var(--vert); letter-spacing: -.03em; }
.dirA__cutlbl { font-size: 11px; line-height: 15px; color: var(--gris); }

.dirA__news { display: flex; gap: 14px; align-items: center; background: #FFF; border: 1px solid var(--filet); border-radius: 4px 16px 16px 4px; padding: 13px 15px; width: 100%; border-left: 3px solid var(--vert); }
.dirA__date { font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--vert); line-height: 1; text-align: center; flex: none; width: 34px; }
.dirA__date i { display: block; font-size: 10px; font-style: normal; color: var(--gris); text-transform: uppercase; margin-top: 3px; }
.dirA__newstag { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--vert-texte); }
.dirA__newstitle { display: block; font-size: 15px; font-weight: 600; margin-top: 3px; }

/* ============================================================
   DIRECTION B · SOUFFLE — profondeur et verre dépoli
   ============================================================ */
.dirB { background: #E4F0E9; position: relative; overflow: hidden; }
.dirB__aura { position: absolute; inset: 0; pointer-events: none; }
.dirB__aura i { position: absolute; border-radius: 50%; filter: blur(34px); }
.dirB__aura i:nth-child(1) { width: 300px; height: 300px; top: -80px; left: -70px; background: rgba(15, 81, 50, .38); animation: floaty 11s ease-in-out infinite; }
.dirB__aura i:nth-child(2) { width: 240px; height: 240px; top: 180px; right: -90px; background: rgba(127, 217, 168, .48); animation: floaty 14s ease-in-out infinite reverse; }
.dirB__aura i:nth-child(3) { width: 260px; height: 260px; bottom: 40px; left: -60px; background: rgba(18, 97, 60, .26); animation: floaty 17s ease-in-out infinite; }

.dirB__content { position: relative; flex-grow: 1; padding: 22px 18px 24px; display: flex; flex-direction: column; gap: 18px; }
.dirB__top { display: flex; align-items: center; gap: 12px; }
.dirB__hello { display: block; font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--encre); }
.dirB__place { display: block; font-size: 12px; font-style: normal; color: #4C6357; margin-top: 2px; }
.dirB__bell { position: relative; width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; background: rgba(255, 255, 255, .62); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .8); }

.dirB__hero {
  position: relative; border-radius: 28px; padding: 26px 22px 22px;
  background: linear-gradient(150deg, rgba(15, 81, 50, .96), rgba(10, 58, 35, .96));
  color: #FFF; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%;
  box-shadow: 0 26px 50px -24px rgba(9, 46, 28, .75);
  overflow: hidden;
}
/* Un reflet traverse la carte, une fois, à l'ouverture. */
.dirB__hero::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
  animation: sweep 2.6s cubic-bezier(.4, 0, .2, 1) .5s both;
}
.dirB__pill { align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0F5132; background: #7FD9A8; padding: 5px 11px; border-radius: 999px; }
.dirB__herotitle { font-family: var(--display); font-size: 42px; font-weight: 700; line-height: .96; letter-spacing: -.03em; margin-top: 4px; }
.dirB__herometa { font-size: 13px; color: #A8CDB9; }
.dirB__cta { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; margin-top: 10px; background: #FFF; color: #0F5132; font-size: 13px; font-weight: 700; padding: 11px 16px; border-radius: 999px; }

.dirB__glassrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.dirB__glass {
  background: rgba(255, 255, 255, .58); backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, .85); border-radius: 20px;
  padding: 16px 10px; text-align: center;
  box-shadow: 0 10px 26px -18px rgba(9, 46, 28, .6);
}
.dirB__glass b { display: block; font-family: var(--display); font-size: 25px; font-weight: 700; color: var(--vert); letter-spacing: -.02em; }
.dirB__glass span { display: block; font-size: 11px; color: #4C6357; margin-top: 3px; }

.dirB__panel {
  background: rgba(255, 255, 255, .74); backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, .9); border-radius: 24px;
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 16px 40px -26px rgba(9, 46, 28, .7);
}
.dirB__item { display: flex; align-items: center; gap: 13px; padding: 11px 0; width: 100%; border-top: 1px solid rgba(15, 81, 50, .10); }
.dirB__item:first-of-type { border-top: 0; }
.dirB__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--vert); flex: none; box-shadow: 0 0 0 4px rgba(15, 81, 50, .12); }
.dirB__itemtitle { display: block; font-size: 15px; font-weight: 600; }
.dirB__itemmeta { display: block; font-size: 12px; color: #4C6357; margin-top: 2px; }

/* ============================================================
   DIRECTION C · TEMPO — typographie massive, contraste
   ============================================================ */
.dirC { background: #FFF; }
.dirC__ticker { background: var(--encre); color: #7FD9A8; overflow: hidden; padding: 9px 0; white-space: nowrap; }
.dirC__ticker span { display: inline-block; font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .18em; animation: ticker 26s linear infinite; }
.dirC__top { display: flex; align-items: center; gap: 12px; padding: 16px 20px 10px; }
.dirC__brand { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.dirC__sub { display: block; font-size: 11px; font-style: normal; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); margin-top: 4px; }

.dirC__poster {
  position: relative; margin: 6px 20px 0; padding: 26px 22px 22px;
  background: var(--vert); color: #FFF; overflow: hidden;
  display: flex; flex-direction: column; gap: 10px; text-align: left; width: calc(100% - 40px);
}
.dirC__posterbg { position: absolute; right: -50px; bottom: -60px; line-height: 0; }
.dirC__kicker { position: relative; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #7FD9A8; }
.dirC__big { position: relative; font-family: var(--display); font-size: 46px; font-weight: 700; line-height: .9; letter-spacing: -.045em; }
.dirC__rule { position: relative; height: 3px; background: #7FD9A8; width: 54px; }
.dirC__foot { position: relative; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A8CDB9; }

.dirC__figures { display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 20px 0; border-top: 2px solid var(--encre); border-bottom: 2px solid var(--encre); }
.dirC__fig { padding: 14px 0; text-align: center; }
.dirC__fig + .dirC__fig { border-left: 1px solid var(--filet); }
.dirC__fig b { display: block; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.dirC__fig span { display: block; font-size: 9px; font-weight: 700; letter-spacing: .16em; color: var(--gris); margin-top: 5px; }

.dirC__list { flex-grow: 1; padding: 22px 20px 24px; display: flex; flex-direction: column; }
.dirC__listhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.dirC__listhead b { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .18em; }
.dirC__row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--filet); width: 100%; }
.dirC__idx { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--vert); letter-spacing: .1em; flex: none; }
.dirC__rowtitle { display: block; font-family: var(--display); font-size: 17px; font-weight: 600; line-height: 21px; }
.dirC__rowmeta { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--gris); margin-top: 5px; }

/* ============================================================
   COQUILLE DE RELECTURE — commentaires, logo, menu mobile
   Rien de tout cela n'appartient à l'application finale : c'est
   l'outillage qui permet au client d'annoter la maquette.
   ============================================================ */

.index__outils { display: flex; gap: 8px; margin-top: 14px; }
.outil {
  flex: 1; min-height: 38px; border-radius: 10px; font-size: 12px; font-weight: 600;
  background: rgba(255, 255, 255, .09); color: #DCEDE4;
  border: 1px solid rgba(255, 255, 255, .14);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.outil:hover { background: rgba(255, 255, 255, .16); }
.outil [data-total] { display: none; }
.outil [data-total].on { display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #7FD9A8; color: #0B1C13; font-size: 11px; font-weight: 700; }

/* Le logo remplace l'emblème dessiné, sans changer sa taille. */
.emblem--img { overflow: hidden; padding: 4px; }
.emblem--img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.index__mark i.emblem--img { padding: 3px; }

/* Bulle de commentaire posée sur le cadre du téléphone */
.device { position: relative; }
.bulle {
  position: absolute; right: -14px; bottom: 92px; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 11px 14px; border-radius: 999px;
  background: #7FD9A8; color: #0B1C13;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 12px 28px -12px rgba(0, 0, 0, .7);
}
.bulle span { display: none; }
.bulle span.on { display: grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: #0F5132; color: #FFF; font-size: 11px; }

/* Liste des fonctionnalités */
.featintro { padding: 14px 20px 10px; display: flex; flex-direction: column; gap: 8px; }
.featintro p { font-size: 13px; line-height: 20px; color: var(--gris); }
.featintro b { color: var(--encre); }
.featintro__note { font-size: 12px; color: var(--gris-clair); }

.featrow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; min-height: 62px; }
.featrow + .featrow { border-top: 1px solid #EDF3F0; }
.featrow:hover { background: #F8FBF9; }
.featrow__t { display: block; font-size: 15px; font-weight: 600; }
.featrow__d { display: block; font-size: 12px; color: var(--gris); margin-top: 2px; line-height: 17px; }
.featrow__end {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  border: 1px dashed var(--bord); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: transparent;
}
.featrow__end.on { border: 0; background: var(--vert); color: #FFF; }

/* Feuille de saisie du commentaire */
.voile {
  position: fixed; inset: 0; z-index: 60; background: rgba(6, 20, 13, .55);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .2s ease both;
}
.feuille {
  width: min(460px, 100%); background: #FFF;
  border-radius: 22px 22px 0 0; padding: 10px 20px 24px;
  display: flex; flex-direction: column; gap: 12px;
  animation: monte .28s cubic-bezier(.2, .8, .3, 1) both;
  max-height: 88vh; overflow-y: auto;
}
@keyframes monte { from { transform: translateY(100%); } }
.feuille__poignee { width: 38px; height: 4px; border-radius: 2px; background: var(--bord); margin: 0 auto 6px; }
.feuille__sur { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.feuille__titre { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 24px; }
.feuille__zone {
  width: 100%; border-radius: 12px; border: 1px solid var(--bord);
  background: #F8FBF9; padding: 13px 14px; font: inherit; font-size: 15px;
  line-height: 22px; resize: vertical; min-height: 120px; color: var(--encre);
}
.feuille__zone:focus { outline: none; border-color: var(--vert); background: #FFF; box-shadow: 0 0 0 3px rgba(15, 81, 50, .12); }
.feuille__actions { display: flex; gap: 10px; }
.feuille__actions .btn { flex: 1; }

/* Barre supérieure et tiroir : téléphone seulement */
.topbar { display: none; }
.tiroir { display: none; }

@media (max-width: 900px) {
  .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--vert); color: #FFF;
    position: sticky; top: 0; z-index: 40;
  }
  .topbar .tapicon { color: #FFF; position: relative; }
  .topbar .tapicon:hover { background: rgba(255, 255, 255, .12); }
  .topbar__titre { flex-grow: 1; font-family: var(--display); font-size: 15px; font-weight: 600; text-align: center; }
  .topbar__pastille { display: none; }
  .topbar__pastille.on { display: grid; place-items: center; position: absolute; top: 6px; right: 4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #7FD9A8; color: #0B1C13; font-size: 10px; font-weight: 700; }

  .wrap { height: auto; min-height: calc(100dvh - 52px); }
  .stage { min-height: calc(100dvh - 52px); }

  /* La bulle de commentaire revient dans l'écran sur téléphone. */
  .bulle { right: 14px; bottom: 78px; }

  .tiroir {
    display: block; position: fixed; inset: 0; z-index: 50;
    background: rgba(6, 20, 13, .5);
    opacity: 0; pointer-events: none; transition: opacity .24s;
  }
  body.tiroir-ouvert .tiroir { opacity: 1; pointer-events: auto; }
  .tiroir__panneau {
    width: min(320px, 86%); height: 100%; overflow-y: auto;
    background: #0B1C13; color: #C7DCD0; padding-bottom: 30px;
    transform: translateX(-100%); transition: transform .28s cubic-bezier(.2, .8, .3, 1);
  }
  body.tiroir-ouvert .tiroir__panneau { transform: none; }
  .tiroir__tete { display: flex; align-items: center; gap: 8px; padding: 14px 10px 12px 20px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
  .tiroir__tete b { flex-grow: 1; font-family: var(--display); font-size: 15px; color: #FFF; }
  .tiroir__tete .tapicon { color: #C7DCD0; }
  .tiroir__outils { padding: 14px 20px 4px; }
  .tiroir__outils .outil { width: 100%; }
}

/* ============================================================
   CARTE DE MEMBRE — et contacts des parents
   ============================================================ */
.calltag {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 7px 11px; border-radius: 999px;
  background: var(--vert-clair); color: var(--vert-texte);
  font-size: 12px; font-weight: 700; text-decoration: none;
}

.carte {
  position: relative; border-radius: 22px; overflow: hidden;
  background: linear-gradient(155deg, #12613C, #0B3F26);
  color: #FFF; box-shadow: 0 24px 48px -22px rgba(9, 46, 28, .8);
}
/* Halo discret : la carte doit avoir de la matière, pas un aplat. */
.carte::after {
  content: ""; position: absolute; top: -70px; right: -70px;
  width: 210px; height: 210px; border-radius: 50%;
  border: 1px solid rgba(127, 217, 168, .28);
  box-shadow: inset 0 0 0 10px rgba(127, 217, 168, .07);
  pointer-events: none;
}

.carte__head { position: relative; display: flex; align-items: center; gap: 11px; padding: 16px 18px 0; }
.carte__org { display: block; font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
.carte__kind { display: block; font-size: 10px; font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: #A8CDB9; margin-top: 2px; }

.carte__body { position: relative; display: flex; gap: 16px; padding: 18px; align-items: flex-start; }
.carte__body > div:first-child { border: 1px solid rgba(255, 255, 255, .22); }
.carte__nom { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 22px; }
.carte__prenom { font-family: var(--display); font-size: 17px; font-weight: 500; color: #CFE5D9; line-height: 20px; }
.carte__body .grade { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .22); color: #FFF; }
.carte__num { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: .16em; color: #7FD9A8; margin-top: 4px; }

.carte__qr { position: relative; display: flex; gap: 14px; align-items: center; padding: 0 18px 18px; }
.carte__qrbox { background: #FFF; border-radius: 12px; padding: 8px; line-height: 0; flex: none; }
.carte__qrbox svg { width: 96px; height: 96px; display: block; }
.carte__qrtitle { font-size: 13px; font-weight: 700; }
.carte__qrtext { font-size: 12px; line-height: 18px; color: #A8CDB9; margin-top: 3px; }
/* La mention « factice » est dans la carte, pas dans une note de bas
   de page : elle doit suivre la capture d'écran si on la partage. */
.carte__faux {
  display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 6px;
  background: rgba(228, 87, 46, .22); border: 1px solid rgba(228, 87, 46, .5);
  color: #FFC3AE; font-size: 10px; font-weight: 700; letter-spacing: .04em;
}

.carte__foot {
  position: relative; display: flex; justify-content: space-between; gap: 14px;
  padding: 0 18px 18px; font-size: 10px; line-height: 15px; color: #A8CDB9;
}
.carte__foot b { color: #FFF; font-size: 12px; }
.carte__band { height: 6px; }

/* Le logo du club est un disque : on l'affiche en rond et à fond
   perdu, sinon son cercle flotte dans un carré blanc. */
.emblem--img { padding: 0; border-radius: 50%; overflow: hidden; background: #FFF; }
.emblem--img img { width: 100%; height: 100%; object-fit: cover; }
.index__mark i.emblem--img { padding: 0; border-radius: 50%; }
.carte__head .emblem--img { box-shadow: 0 0 0 1px rgba(255, 255, 255, .35); }

  </style>
</head>

            <span class="featrow__end" data-count="clb-presentation"></span>
          </button>
          <button class="featrow" data-feat="clb-valeurs" data-screen="club">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Valeurs</b>
              <span class="featrow__d">Trois principes affichés</span>
            </span>
            <span class="featrow__end" data-count="clb-valeurs"></span>
          </button>
          <button class="featrow" data-feat="clb-horaires" data-screen="club">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Horaires d’entraînement</b>
              <span class="featrow__d">Jours, heures, niveaux</span>
            </span>
            <span class="featrow__end" data-count="clb-horaires"></span>
          </button>
          <button class="featrow" data-feat="clb-contact" data-screen="club">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Contact et localisation</b>
              <span class="featrow__d">Responsable, téléphone, adresse</span>
            </span>
            <span class="featrow__end" data-count="clb-contact"></span>
          </button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <h2 class="overline">Administration</h2>
        <div class="list">
          <button class="featrow" data-feat="adm-ajout" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Ajouter un étudiant</b>
              <span class="featrow__d">Fiche, photo, grade, parents</span>
            </span>
            <span class="featrow__end" data-count="adm-ajout"></span>
          </button>
          <button class="featrow" data-feat="adm-modif" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Modifier une fiche</b>
              <span class="featrow__d">Corriger ou compléter</span>
            </span>
            <span class="featrow__end" data-count="adm-modif"></span>
          </button>
          <button class="featrow" data-feat="adm-grade" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Changer un grade</b>
              <span class="featrow__d">Après un passage validé</span>
            </span>
            <span class="featrow__end" data-count="adm-grade"></span>
          </button>
          <button class="featrow" data-feat="adm-comptes" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Comptes et accès</b>
              <span class="featrow__d">Créer, suspendre, réinitialiser</span>
            </span>
            <span class="featrow__end" data-count="adm-comptes"></span>
          </button>
          <button class="featrow" data-feat="adm-publier" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Publier une actualité</b>
              <span class="featrow__d">Et envoyer la notification</span>
            </span>
            <span class="featrow__end" data-count="adm-publier"></span>
          </button>
          <button class="featrow" data-feat="adm-album" data-screen="admin">
            <span style="flex-grow:1;min-width:0;text-align:left">
              <b class="featrow__t">Gérer les albums</b>
              <span class="featrow__d">Créer, ajouter et classer les photos</span>
            </span>
            <span class="featrow__end" data-count="adm-album"></span>
          </button>
        </div>
      </div>
    </div>
  </div>`
  }
};

  </script>
  <script>
/* ============================================================
   app.js — Coquille de la maquette

   Trois rôles, aucun n'appartient à l'application finale :
     · parcourir les écrans (index à gauche, menu sur téléphone) ;
     · recueillir les commentaires du client, écran par écran et
       fonctionnalité par fonctionnalité, puis les exporter ;
     · essayer le logo du club sans passer par un développeur.
   ============================================================ */

const GROUPES = [
  ['À relire', ['fonctionnalites']],
  ['Entrée', ['connexion', 'accueil']],
  ['Étudiants', ['etudiants', 'profilVerrouille', 'profilOuvert', 'carte']],
  ['Casier', ['casier', 'casierDetail', 'notifications']],
  ['Album', ['album', 'photo']],
  ['Le club', ['club']],
  ['Administration', ['admin']],
  ['Directions à choisir', ['directionA', 'directionB', 'directionC']],
  ['Référence', ['charte']]
];
const ORDRE = GROUPES.flatMap(([, k]) => k);

const app = { current: 'fonctionnalites', el: {} };

/* ---------------------------------------------- Stockage local
   Commentaires et logo restent sur l'appareil du client : la
   maquette n'envoie rien nulle part. */
const MAGASIN = {
  lire(cle, secours) {
    try { return JSON.parse(localStorage.getItem('waishi.' + cle)) ?? secours; }
    catch { return secours; }
  },
  ecrire(cle, valeur) {
    try { localStorage.setItem('waishi.' + cle, JSON.stringify(valeur)); } catch { /* mode privé */ }
  }
};

let commentaires = MAGASIN.lire('commentaires', {});
/* Trois sources, dans cet ordre : le logo choisi sur cet appareil,
   celui livré avec la maquette, puis un fichier posé dans img/. */
let logo = MAGASIN.lire('logo', null)
  || (typeof LOGO_INTEGRE !== 'undefined' ? LOGO_INTEGRE : null);

/* Libellé lisible d'une clé de commentaire, pour l'export. */
function nomFonction(cle) {
  if (cle.startsWith('ecran:')) {
    const k = cle.slice(6);
    return 'Écran — ' + (SCREENS[k] ? SCREENS[k].label.replace(/^\d+\s·\s/, '') : k);
  }
  const el = document.querySelector(`[data-feat="${cle}"] .featrow__t`);
  return el ? el.textContent : cle;
}

/* ---------------------------------------------- Rendu d'un écran */
function afficher(cle) {
  const ecran = SCREENS[cle];
  if (!ecran) return;
  app.current = cle;

  app.el.stage.innerHTML = ecran.wide
    ? `<div class="wide">${ecran.html}</div>`
    : `<div class="device"><div class="device__screen">${ecran.html}</div></div>`;

  /* Bouton de commentaire sur chaque écran de maquette : le client
     peut réagir à ce qu'il voit, pas seulement à une liste. */
  if (!ecran.wide && cle !== 'fonctionnalites') {
    app.el.stage.querySelector('.device').insertAdjacentHTML('beforeend',
      `<button class="bulle" data-feat="ecran:${cle}" aria-label="Commenter cet écran">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>
        <span data-count="ecran:${cle}"></span>
      </button>`);
  }

  app.el.stage.insertAdjacentHTML('beforeend', `<p class="stage__caption" id="caption"></p>`);
  document.getElementById('caption').innerHTML =
    `<b>${ecran.label.replace(/^\d+\s·\s/, '')}</b> — maquette, en attente de validation`;

  /* Entrée en cascade des blocs. */
  const racine = app.el.stage.querySelector('.phone, .sheet');
  if (racine) {
    (racine.querySelector('.dirA__body, .dirB__content, [style*="flex-grow:1"]') || racine)
      .classList.add('enter');
  }

  appliquerLogo();
  rafraichirCompteurs();
  marquerActif();
  app.el.stage.scrollTop = 0;
  if (app.el.titre) app.el.titre.textContent = ecran.label.replace(/^\d+\s·\s/, '');
  fermerTiroir();
}

function marquerActif() {
  document.querySelectorAll('#index [data-go], #tiroir [data-go]').forEach((b) =>
    b.setAttribute('aria-current', String(b.dataset.go === app.current)));
}

/* ---------------------------------------------- Logo du club */
function appliquerLogo() {
  if (!logo) return;
  /* Chaque emplacement d'emblème reçoit l'image, en conservant sa
     taille : un seul fichier suffit pour toute la maquette. */
  document.querySelectorAll('.emblem, .index__mark i').forEach((n) => {
    n.innerHTML = `<img src="${logo}" alt="Logo du club">`;
    n.classList.add('emblem--img');
  });
}

function choisirLogo() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/svg+xml,image/webp';
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 1.5 * 1024 * 1024) {
      alert('Image trop lourde (maximum 1,5 Mo). Réduisez-la avant de la charger.');
      return;
    }
    const lecteur = new FileReader();
    lecteur.onload = () => {
      logo = lecteur.result;
      MAGASIN.ecrire('logo', logo);
      afficher(app.current);
    };
    lecteur.readAsDataURL(f);
  });
  input.click();
}

/* ---------------------------------------------- Commentaires */
function rafraichirCompteurs() {
  document.querySelectorAll('[data-count]').forEach((n) => {
    const c = commentaires[n.dataset.count];
    n.textContent = c ? '1' : '';
    n.classList.toggle('on', !!c);
  });
  const total = Object.keys(commentaires).length;
  document.querySelectorAll('[data-total]').forEach((n) => {
    n.textContent = total ? total : '';
    n.classList.toggle('on', total > 0);
  });
}

function ouvrirCommentaire(cle) {
  const existant = commentaires[cle];
  const titre = nomFonction(cle);
  fermerVoile();
  document.body.insertAdjacentHTML('beforeend', `
    <div class="voile" data-fermer>
      <div class="feuille" role="dialog" aria-label="Commentaire">
        <div class="feuille__poignee"></div>
        <p class="feuille__sur">Votre commentaire</p>
        <p class="feuille__titre">${titre}</p>
        <textarea class="feuille__zone" id="zoneCommentaire" rows="5"
          placeholder="Ce qu’il faut changer, ajouter ou retirer…">${existant ? existant.texte : ''}</textarea>
        <div class="feuille__actions">
          ${existant ? '<button class="btn btn--ghost" data-action="supprimerCommentaire">Supprimer</button>' : ''}
          <button class="btn btn--primary" data-action="enregistrerCommentaire" data-cle="${cle}">Enregistrer</button>
        </div>
      </div>
    </div>`);
  const zone = document.getElementById('zoneCommentaire');
  zone.focus();
  zone.selectionStart = zone.value.length;
  app.cleCourante = cle;
}

function enregistrerCommentaire() {
  const texte = document.getElementById('zoneCommentaire').value.trim();
  if (texte) {
    commentaires[app.cleCourante] = { texte, date: new Date().toISOString().slice(0, 10) };
  } else {
    delete commentaires[app.cleCourante];
  }
  MAGASIN.ecrire('commentaires', commentaires);
  fermerVoile();
  rafraichirCompteurs();
}

function supprimerCommentaire() {
  delete commentaires[app.cleCourante];
  MAGASIN.ecrire('commentaires', commentaires);
  fermerVoile();
  rafraichirCompteurs();
}

/* L'export produit un texte simple : lisible dans un courriel, dans
   un message, ou collé tel quel dans un ticket. */
function exporter() {
  const cles = Object.keys(commentaires);
  if (!cles.length) {
    alert('Aucun commentaire pour le moment.\n\nTouchez une fonctionnalité pour en écrire un.');
    return;
  }
  const lignes = [
    'COMMENTAIRES SUR LA MAQUETTE',
    'Kung-fu Waishi Analamahitsy',
    `Le ${new Date().toLocaleDateString('fr-FR')} · ${cles.length} commentaire${cles.length > 1 ? 's' : ''}`,
    ''
  ];
  cles.forEach((k) => {
    lignes.push('— ' + nomFonction(k), commentaires[k].texte, '');
  });
  const texte = lignes.join('\n');

  const blob = new Blob([texte], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'commentaires-waishi.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  if (navigator.clipboard) navigator.clipboard.writeText(texte).catch(() => {});
}

function fermerVoile() { document.querySelector('.voile')?.remove(); }

/* ---------------------------------------------- Menu sur téléphone */
function listeEcrans(id) {
  return `<div id="${id}">
    ${GROUPES.map(([titre, cles]) => `
      <p class="index__group">${titre}</p>
      ${cles.map((k) => `<button class="index__link" data-go="${k}">
          <span class="index__num">${(SCREENS[k].label.match(/^\d+/) || ['·'])[0]}</span>
          <span>${SCREENS[k].label.replace(/^\d+\s·\s/, '')}</span>
        </button>`).join('')}`).join('')}
  </div>`;
}

function ouvrirTiroir() { document.body.classList.add('tiroir-ouvert'); }
function fermerTiroir() { document.body.classList.remove('tiroir-ouvert'); }

/* ---------------------------------------------- Démarrage */
document.addEventListener('DOMContentLoaded', () => {
  app.el.index = document.getElementById('index');
  app.el.stage = document.getElementById('stage');

  const marque = `<div class="index__brand">
      <div class="index__mark">
        <i><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F5132"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4 6.5v5c0 5 3.4 8.6 8 9.5 4.6-.9 8-4.5 8-9.5v-5z"/>
          <path d="M9 12.2l2 2 4-4.4"/></svg></i>
        Kung-fu Waishi
      </div>
      <p class="index__sub">Analamahitsy · maquette ${Object.keys(SCREENS).length} écrans</p>
      <div class="index__outils">
        <button class="outil" data-action="logo">Logo du club</button>
        <button class="outil" data-action="exporter">Exporter <span data-total></span></button>
      </div>
    </div>`;

  app.el.index.innerHTML = marque + listeEcrans('listeBureau');

  /* Barre supérieure et tiroir : ils n'apparaissent que sur petit
     écran, où l'index latéral n'a pas la place d'exister. */
  document.body.insertAdjacentHTML('afterbegin', `
    <header class="topbar">
      <button class="tapicon" data-action="menu" aria-label="Liste des écrans">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="topbar__titre" id="topbarTitre"></span>
      <button class="tapicon" data-action="exporter" aria-label="Exporter les commentaires">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
        <span class="topbar__pastille" data-total></span>
      </button>
    </header>
    <div class="tiroir" id="tiroir">
      <div class="tiroir__panneau">
        <div class="tiroir__tete">
          <b>Écrans de la maquette</b>
          <button class="tapicon" data-action="fermerMenu" aria-label="Fermer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="tiroir__outils">
          <button class="outil" data-action="logo">Logo du club</button>
        </div>
        ${listeEcrans('listeMobile')}
      </div>
    </div>`);
  app.el.titre = document.getElementById('topbarTitre');

  /* Rien d'embarqué ? On cherche un fichier déposé dans img/, quelle
     que soit son extension — le club envoie ce qu'il a sous la main. */
  if (!logo) {
    ['png', 'jpg', 'jpeg', 'webp', 'svg'].forEach((ext) => {
      const essai = new Image();
      essai.onload = () => { if (!logo) { logo = `img/logo.${ext}`; appliquerLogo(); } };
      essai.src = `img/logo.${ext}`;
    });
  }

  afficher('fonctionnalites');

  document.addEventListener('click', (e) => {
    if (e.target.matches('.voile[data-fermer]')) { fermerVoile(); return; }

    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'logo') choisirLogo();
      if (a === 'exporter') exporter();
      if (a === 'menu') ouvrirTiroir();
      if (a === 'fermerMenu') fermerTiroir();
      if (a === 'enregistrerCommentaire') enregistrerCommentaire();
      if (a === 'supprimerCommentaire') supprimerCommentaire();
      return;
    }

    /* Une ligne de fonctionnalité ouvre son commentaire ; l'icône
       d'écran à droite mène à l'écran correspondant. */
    const feat = e.target.closest('[data-feat]');
    if (feat) { ouvrirCommentaire(feat.dataset.feat); return; }

    const nav = e.target.closest('[data-go]');
    if (nav) afficher(nav.dataset.go);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { fermerVoile(); fermerTiroir(); return; }
    if (e.target.matches('textarea, input')) return;
    const i = ORDRE.indexOf(app.current);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); afficher(ORDRE[(i + 1) % ORDRE.length]); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); afficher(ORDRE[(i - 1 + ORDRE.length) % ORDRE.length]); }
  });
});

  </script>
</body>
